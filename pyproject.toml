[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miax-b1-t1-equipo7-toolkit"
version = "0.1.0"
description = "Extracción y análisis de datos de mercado para el taller MIAX B1-T1"
readme = "README.MD"
# Versión mínima admitida; el equipo desarrolla con la indicada en .python-version.
requires-python = ">=3.11"
# Versiones mínimas con las que se han ejecutado las pruebas.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "curl_cffi>=0.6",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff==0.17.2", "coverage==7.17.2"]

[tool.setuptools]
# Excluye datos descargados y credenciales del paquete instalado.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.ruff]
# Sin target-version: Ruff toma la versión mínima de requires-python.
line-length = 100

[tool.ruff.lint]
# Errores de sintaxis, nombres sin usar y orden de las importaciones.
select = ["E4", "E7", "E9", "F", "I", "B"]

# CI aplica C901, PLR0912 y PLR0915 a src; el lint general incluye pruebas y diagramas.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.coverage.run]
branch = true
source = ["src"]
relative_files = true

[tool.coverage.report]
# La suite sin red parte de un 94,81 % combinado de líneas y ramas (Python 3.14).
fail_under = 94
precision = 2
show_missing = true
skip_covered = true
