[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miax-b1-t1-equipo7-toolkit"
version = "0.1.0"
description = "Extracción y análisis de datos de mercado para el taller MIAX B1-T1"
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.17",
    "pandas>=1.3.0",
    "matplotlib>=3.0.0",
    "yfinance>=0.1.70",
    "requests>=2.25.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[tool.setuptools]
# Excluye datos descargados y credenciales del paquete instalado.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Errores de sintaxis, nombres sin usar y orden de las importaciones.
select = ["E4", "E7", "E9", "F", "I", "B"]
