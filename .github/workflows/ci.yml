name: Comprobaciones de Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  RUFF_NO_CACHE: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Calidad y formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # La misma versión con la que desarrolla el equipo.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar herramientas de calidad
        run: python -m pip install ".[dev]"
      - name: Comprobar código e importaciones
        run: python -m ruff check --output-format=github .
      - name: Comprobar formato
        if: ${{ !cancelled() }}
        run: python -m ruff format --check .

  tests:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # La versión mínima de pyproject.toml y la de .python-version.
        python-version: ["3.11", "3.14"]
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias del proyecto
        run: python -m pip install .
      - name: Ejecutar pruebas sin conexión
        run: python -m unittest discover -s tests -v
