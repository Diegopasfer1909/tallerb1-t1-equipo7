name: Comprobaciones de Python

on:
  # Las ramas se prueban en su pull request; el push solo a main evita ejecutar todo dos veces.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Lunes a las 06:00 UTC: detecta cambios en las API aunque no haya commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  RUFF_NO_CACHE: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Calidad y formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar herramientas de calidad
        run: python -m pip install ".[dev]"
      - name: Comprobar código e importaciones
        run: python -m ruff check --output-format=github .
      - name: Comprobar formato
        if: ${{ !cancelled() }}
        run: python -m ruff format --check .

  tests:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias del proyecto
        run: python -m pip install .
      - name: Ejecutar pruebas sin conexión
        run: python -m unittest discover -s tests -v

  paquete:
    name: Paquete instalable
    # Las pruebas anteriores importan src desde el repositorio; aquí se prueba la rueda que
    # se instalaría, para detectar módulos que no se empaquetan o metadatos incorrectos.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Construir la distribución
        run: |
          python -m pip install build twine
          python -m build
      - name: Comprobar los metadatos
        run: python -m twine check --strict dist/*
      - name: Comprobar el contenido de la rueda
        # Solo debe contener el código de src y sus metadatos: ni pruebas, ni informes, ni claves.
        run: |
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path

          names = zipfile.ZipFile(next(Path("dist").glob("*.whl"))).namelist()
          print("\n".join(names))
          unexpected = [name for name in names if not name.startswith("src/") and ".dist-info/" not in name]
          if unexpected:
              sys.exit(f"Archivos inesperados en la rueda: {', '.join(unexpected)}")
          PY
      - name: Instalar la rueda
        run: python -m pip install dist/*.whl
      - name: Ejecutar las pruebas con el paquete instalado
        # -P impide que Python añada la carpeta actual a sys.path, así que src se importa desde
        # site-packages y un módulo que falte en la rueda hace fallar las pruebas.
        run: |
          python -P -c "import src, sys; sys.exit(0 if 'site-packages' in src.__file__ else f'src se importa desde {src.__file__}')"
          python -P -m unittest discover -s tests

  secretos:
    name: Búsqueda de claves filtradas
    # GitHub no reconoce el formato de las claves de Alpha Vantage ni de FRED, así que su
    # escaneo de secretos no las detecta. gitleaks revisa todo el historial con las reglas de
    # .gitleaks.toml. Si encuentra una clave real, revócala antes de nada: el repositorio es
    # público. Un falso positivo se excluye con su huella en .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Obtener el repositorio con todo el historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Buscar claves en el historial
        # --redact evita que una clave encontrada aparezca en el registro público del trabajo.
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .'

  integracion:
    name: Integración con las API reales
    # Se ejecuta en cada pull request, tras integrar en main, cada lunes y a mano. Usa los
    # secretos del repositorio: las pull requests desde forks no los reciben y fallan aquí.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # En una pull request, HEAD es la fusión de prueba: sus dos padres permiten ver qué
          # archivos cambia respecto a main.
          fetch-depth: 2
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias del proyecto
        run: python -m pip install .
      - name: Decidir si se consulta Alpha Vantage
        # Su plan gratuito admite 25 consultas al día, compartidas con el uso local de la clave.
        # Las pull requests solo la consultan si cambian el adaptador, sus pruebas o el pipeline;
        # tras integrar en main, cada lunes y a mano se consulta siempre.
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          pattern='^(src/providers/|src/validation\.py|tests/integration_apis\.py|pyproject\.toml|\.github/workflows/)'
          if grep -qE "$pattern" <<< "$changed"; then
            echo "La pull request cambia archivos que afectan a Alpha Vantage: se consulta la API."
          else
            echo "ALPHA_VANTAGE_INTEGRATION=0" >> "$GITHUB_ENV"
            echo "::notice title=Alpha Vantage sin consultar::La pull request no cambia su adaptador; se reserva la cuota diaria."
          fi
      - name: Comprobar los secretos
        # Sin claves, las pruebas reales se omitirían y el trabajo pasaría sin probar nada.
        run: |
          missing=0
          for name in FRED_API_KEY ALPHA_VANTAGE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Falta un secreto::$name no está disponible para este trabajo."
              missing=1
            fi
          done
          exit $missing
      - name: Ejecutar pruebas de integración
        run: python -m unittest tests.integration_apis -v

  resultado:
    name: Comprobaciones completas
    # Única comprobación obligatoria para integrar en main. Falla si algún trabajo falla, se
    # cancela o se omite: una prueba real omitida no debe contar como superada.
    if: ${{ always() }}
    needs: [lint, tests, paquete, secretos, integracion]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revisar el resultado de cada trabajo
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          results = {name: job["result"] for name, job in json.loads(os.environ["RESULTADOS"]).items()}
          for name, result in results.items():
              print(f"{name}: {result}")
          failed = [name for name, result in results.items() if result != "success"]
          if failed:
              sys.exit(f"Trabajos sin superar: {', '.join(failed)}")
          PY
